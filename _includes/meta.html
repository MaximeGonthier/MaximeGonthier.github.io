    <meta charset="utf-8" />
    <meta content='text/html; charset=utf-8' http-equiv='Content-Type'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    {% if page.excerpt %}
    <meta name="description" content="{{ page.excerpt| strip_html }}" />
    <meta property="og:description" content="{{ page.excerpt| strip_html }}" />
    {% else %}
    <meta name="description" content="{{ site.description }}">
    <meta property="og:description" content="{{ site.description }}" />
    {% endif %}
    <meta name="author" content="{{ site.name }}" />

    {% if page.title %}
    <meta property="og:title" content="{{ page.title }}" />
    <meta property="twitter:title" content="{{ page.title }}" />
    {% endif %}

    <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/assets/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/assets/brand/favicon-32.png" />
    <link rel="alternate icon" href="{{ site.baseurl }}/assets/brand/favicon.ico" />
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/brand/apple-touch-icon.png" />

    <!-- Link previews (LinkedIn, Slack, X, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ site.name }}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:image" content="{{ '/assets/brand/og-image.png' | absolute_url }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="{{ '/assets/brand/og-image.png' | absolute_url }}" />
